
syntax = "proto2";
package perfetto.protos;

import "protos/perfetto/common/arm_gpu_counters.proto";

message ArmGpuStats {
  message ArmGpuInfoValue {
    optional ArmGpuCounters key = 1;
    oneof value {
      uint64 int_value = 2;
      double double_value = 3;
      // string string_value = 4;
    }
    // optional uint64 value = 2;
  };
  repeated ArmGpuInfoValue arm_gpuinfo = 1;
}